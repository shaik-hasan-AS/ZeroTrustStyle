version: '3.8'

services:
  client:
    build:
      context: ./client
    container_name: client-portal
    ports:
      - "3000:3000"
    volumes:
      - ./certs:/certs:ro
      - ./client/app:/app
    environment:
      - GATEWAY_URL=https://gateway:8000
      - ACCOUNT_SERVICE_URL=https://account-service:8001
      - LEDGER_SERVICE_URL=https://ledger-service:8002
      - OPA_URL=http://opa:8181
    networks:
      - zero-trust-net
    depends_on:
      - gateway

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/certs:ro
    networks:
      - zero-trust-net
    depends_on:
      - account-service

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    ports:
      - "8001:8001"
    volumes:
      - ./certs:/certs:ro
      - account_data:/data
    networks:
      - zero-trust-net
    depends_on:
      - ledger-service
      - opa

  ledger-service:
    build:
      context: ./ledger-service
    container_name: ledger-service
    ports:
      - "8002:8002"
    volumes:
      - ./certs:/certs:ro
      - ledger_data:/data
    networks:
      - zero-trust-net
    depends_on:
      - opa

  opa:
    image: openpolicyagent/opa:latest-debug
    container_name: opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr"
      - "0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./opa/policies:/policies:ro
    networks:
      - zero-trust-net

volumes:
  account_data:
  ledger_data:

networks:
  zero-trust-net:
    driver: bridge
